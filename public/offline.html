<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030708" />
    <meta name="robots" content="noindex, nofollow" />
    <title>HANZI.OS đang ngoại tuyến</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #030708;
        color: #e8f2ef;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(81, 246, 193, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(81, 246, 193, 0.035) 1px, transparent 1px),
          #030708;
        background-size: 44px 44px;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(28px, 7vw, 56px);
        background: #081210;
        border: 1px solid #31564d;
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      small {
        color: #51f6c1;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(32px, 8vw, 52px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: #a8beb7;
        font-size: 16px;
        line-height: 1.7;
      }

      a {
        min-height: 48px;
        margin-top: 28px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #03100d;
        background: #51f6c1;
        border: 1px solid #51f6c1;
        border-radius: 4px;
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #55d9ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <small>OFFLINE RECOVERY</small>
      <h1>HANZI.OS đang ngoại tuyến</h1>
      <p>
        Không thể tải trang này từ mạng hoặc bộ nhớ ngoại tuyến. Tiến độ đã lưu
        trên thiết bị không tự bị xóa; hãy kết nối lại rồi thử mở ứng dụng.
      </p>
      <a href="/">Thử mở lại HANZI.OS</a>
    </main>
  </body>
</html>
